android {
    namespace "com.fcaronte.aabrowser"
    compileSdk = 37

    defaultConfig {
        applicationId "com.fcaronte.aabrowser"
        minSdk 29
        targetSdk 37
        versionCode 13
        versionName "2.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    buildFeatures {
        compose true
        buildConfig true
    }

    signingConfigs {
        config {
            def keystoreFileEnv = System.getenv('KEYSTORE_FILE')
            def keystorePasswordEnv = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasEnv = System.getenv('KEY_ALIAS')
            def keyPasswordEnv = System.getenv('KEY_PASSWORD')

            def propFile = rootProject.file('signing.properties')
            def signingProps = new Properties()

            if (keystoreFileEnv && keystorePasswordEnv && keyAliasEnv && keyPasswordEnv && file(keystoreFileEnv).exists()) {
                storeFile = file(keystoreFileEnv)
                storePassword = keystorePasswordEnv
                keyAlias = keyAliasEnv
                keyPassword = keyPasswordEnv
            } else if (propFile.exists()) {
                signingProps.load(new FileInputStream(propFile))
                def storeFilePath = signingProps['storeFile']
                if (storeFilePath) {
                    def kFile = file(storeFilePath)
                    if (!kFile.exists()) {
                        kFile = rootProject.file(storeFilePath)
                    }
                    if (kFile.exists()) {
                        storeFile = kFile
                        storePassword = signingProps['storePassword']
                        keyAlias = signingProps['keyAlias']
                        keyPassword = signingProps['keyPassword']
                    }
                }
            }
        }
    }

    buildTypes {
        debug {
            if (signingConfigs.config.storeFile != null) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
        }
        release {
            if (signingConfigs.config.storeFile != null) {
                signingConfig signingConfigs.config
            } else {
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def version = variant.versionName
            def buildType = variant.buildType.name
            def name = "AABrowser"
            if (buildType == "debug") {
                name += "-debug"
            }
            outputFileName = "${name}-v${version}.apk"
        }
    }
}

