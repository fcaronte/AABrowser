plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.compose)
}

android {
    namespace "com.fcaronte.aabrowser"
    compileSdk = 37

    defaultConfig {
        applicationId "com.fcaronte.aabrowser"
        minSdk 29
        targetSdk 37
        versionCode 9
        versionName "1.8"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    buildFeatures {
        compose true
    }

    signingConfigs {
        config {
            def signingProps = new Properties()
            def propFile = file('../signing.properties')
            if (propFile.exists()) {
                signingProps.load(new FileInputStream(propFile))
                storeFile = file(signingProps['storeFile'])
                storePassword = signingProps['storePassword']
                keyAlias = signingProps['keyAlias']
                keyPassword = signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def version = variant.versionName
            def buildType = variant.buildType.name
            def name = "AABrowser"
            if (buildType == "debug") {
                name += "-debug"
            }
            outputFileName = "${name}-v${version}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs/v4', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: 'libs/v5', include: ['*.jar', '*.aar'], exclude: ['android-support-car.aar', 'gearhead-sdk.aar', 'gearhead-sdk-ui.aar'])

    implementation libs.androidx.appcompat
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.media
    implementation libs.material

    // Compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.compose.ui
    implementation libs.androidx.compose.ui.graphics
    implementation libs.androidx.compose.ui.tooling.preview
    implementation libs.androidx.compose.material3
    implementation libs.androidx.compose.material.icons.extended
    implementation libs.androidx.activity.compose
    implementation libs.androidx.lifecycle.viewmodel.compose
    implementation libs.androidx.lifecycle.runtime.compose

    implementation libs.coil.compose
    implementation libs.androidx.webkit
    implementation libs.zxing.core
    implementation libs.play.services.location

    implementation libs.kotlin.stdlib
}
