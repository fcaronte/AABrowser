apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace "com.fcaronte.aabrowser"
    compileSdk = 37

    defaultConfig {
        applicationId "com.fcaronte.aabrowser"
        minSdk 29
        targetSdk 37
        versionCode 6
        versionName "1.5"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }


    buildFeatures {
        compose true
    }

    signingConfigs {
        config {
            def signingProps = new Properties()
            def propFile = file('../signing.properties')
            if (propFile.exists()) {
                signingProps.load(new FileInputStream(propFile))
                storeFile = file(signingProps['storeFile'])
                storePassword = signingProps['storePassword']
                keyAlias = signingProps['keyAlias']
                keyPassword = signingProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.config
        }
        release {
            signingConfig signingConfigs.config
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def version = variant.versionName
            def buildType = variant.buildType.name
            def name = "AABrowser"
            if (buildType == "debug") {
                name += "-debug"
            }
            outputFileName = "${name}-v${version}.apk"
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs/v4', include: ['*.jar', '*.aar'])
    implementation fileTree(dir: 'libs/v5', include: ['*.jar', '*.aar'], exclude: ['android-support-car.aar', 'gearhead-sdk.aar', 'gearhead-sdk-ui.aar'])

    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.media:media:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Compose
    def composeBom = platform('androidx.compose:compose-bom:2026.08.00')
    implementation composeBom
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.13.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.11.0'

    implementation 'io.coil-kt:coil-compose:2.7.0'
    implementation 'androidx.webkit:webkit:1.17.0'
    implementation 'com.google.zxing:core:3.5.4'

    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.4.10'
}
