<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CarWeb Media</title>
    <link rel="icon" href="icon.svg">
    <link rel="stylesheet" href="player.css">
    <!-- Colori Material You del telefono, inseriti dall'app (vuoto = colori di player.css) -->
    <style>/*AAB_THEME*/</style>
    <!-- Token e testi tradotti, inseriti dall'app quando serve la pagina (LocalPlayer) -->
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<header class="bar">
    <a class="icon-button" href="/tv" aria-label="TV">
        <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
    </a>
    <a class="icon-button" href="/radio" aria-label="Radio">
        <svg viewBox="0 0 24 24"><path d="M10 4 22 1l.5 2L11 6zm-5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2zm1 3v9h7v-9zm11 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
    </a>
    <a class="icon-button" href="/podcast" aria-label="Podcast">
        <svg viewBox="0 0 24 24"><path d="M14 12c0 .74-.4 1.38-1 1.72V22h-2v-8.28c-.6-.35-1-.98-1-1.72 0-1.1.9-2 2-2s2 .9 2 2zm-2-6c-3.31 0-6 2.69-6 6 0 1.74.75 3.31 1.94 4.4l1.42-1.42C8.53 14.25 8 13.19 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.19-.53 2.25-1.36 2.98l1.42 1.42C17.25 15.31 18 13.74 18 12c0-3.31-2.69-6-6-6zm0-4C6.48 2 2 6.48 2 12c0 2.85 1.2 5.41 3.11 7.24l1.42-1.42C4.98 16.36 4 14.29 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 2.29-.98 4.36-2.53 5.82l1.42 1.42C20.8 17.41 22 14.85 22 12c0-5.52-4.48-10-10-10z"/></svg>
    </a>
    <div class="bar-spacer"></div>
    <button class="icon-button" id="optionsButton">
        <svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>
    </button>
    <button class="text-button" id="pickFolder"></button>
    <input id="folderInput" type="file" webkitdirectory multiple hidden>
</header>

<main class="layout">
    <section class="now">
        <div class="stage" id="stage">
            <video id="media" playsinline preload="metadata"></video>
            <div class="art" id="art">
                <img id="artImage" alt="">
                <svg class="note" viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
            </div>
            <!-- Effetti animati sopra la copertina (solo audio) -->
            <canvas class="visual" id="visual" hidden></canvas>
        </div>

        <div class="info">
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
            <button class="lyrics-button" id="lyricsButton" hidden></button>
        </div>

        <div class="seek">
            <span id="currentTime">0:00</span>
            <input id="seek" type="range" min="0" max="1000" step="1" value="0">
            <span id="totalTime">0:00</span>
        </div>

        <!-- Niente etichette "Play"/"Pausa" sui pulsanti: gli script generici di Android Auto li cliccherebbero -->
        <div class="controls">
            <button class="control toggle" id="shuffle">
                <svg viewBox="0 0 24 24"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/></svg>
            </button>
            <button class="control" id="previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="control main" id="playToggle">
                <svg class="icon-start" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-stop" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="control" id="next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="control toggle" id="repeat">
                <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
            </button>
        </div>

        <div class="message" id="message" hidden></div>
    </section>

    <section class="list" id="listPanel">
        <div class="list-head">
            <input class="search" id="search" type="search" autocomplete="off">
            <!-- Audio e video in code separate: compaiono solo se la cartella li contiene entrambi -->
            <div class="tabs" id="tabs" hidden>
                <button class="tab" id="tabAudio"></button>
                <button class="tab" id="tabVideo"></button>
            </div>
        </div>
        <ul id="tracks"></ul>
    </section>
</main>

<!-- Opzioni: dissolvenza tra i brani ed effetti animati (salvate nella pagina) -->
<div class="sheet" id="optionsSheet" hidden>
    <div class="sheet-card">
        <div class="sheet-title" id="optionsTitle"></div>
        <div class="option-label" id="crossfadeLabel"></div>
        <div class="choices" id="crossfadeChoices"></div>
        <div class="option-label" id="effectsLabel"></div>
        <div class="choices" id="effectsChoices"></div>
    </div>
</div>

<script src="/track-parser.js"></script>
<script src="/lyrics.js"></script>
<script src="player.js"></script>
</body>
</html>
