<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Altre App</title>
    <link rel="icon" href="/apps.svg">
    <link rel="stylesheet" href="/player.css">
    <link rel="stylesheet" href="/apps.css">
    <style>/*AAB_THEME*/</style>
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<header class="bar">
    <!-- Stato di Shizuku: verde se le app si possono aprire sul display virtuale, rosso se manca qualcosa -->
    <div class="shizuku" id="shizuku">
        <span class="dot" id="dot"></span>
        <span class="shizuku-text" id="shizukuText"></span>
    </div>
    <button class="text-button" id="authorize" hidden></button>
    <!-- La ricerca sta sempre qui, a destra dello stato di Shizuku: niente tasto con la lente da toccare prima -->
    <input class="search" id="search" type="search" autocomplete="off">
</header>

<div class="apps-hint" id="hint" hidden></div>

<main class="apps-grid" id="grid"></main>
<div class="apps-message" id="message" hidden></div>

<script src="/apps.js"></script>
</body>
</html>
