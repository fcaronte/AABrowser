<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Altre App</title>
    <link rel="icon" href="/apps.svg">
    <link rel="stylesheet" href="/player.css">
    <link rel="stylesheet" href="/apps.css">
    <style>/*AAB_THEME*/</style>
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<header class="bar">
    <!-- Stato di Shizuku: verde se le app si possono aprire sul display virtuale, rosso se manca qualcosa -->
    <div class="shizuku" id="shizuku">
        <span class="dot" id="dot"></span>
        <span class="shizuku-text" id="shizukuText"></span>
    </div>
    <button class="text-button" id="authorize" hidden></button>
    <span class="bar-spacer"></span>
    <button class="icon-button" id="searchToggle" aria-label="Search">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
</header>

<div class="apps-search" id="searchBar" hidden>
    <input class="search" id="search" type="search" autocomplete="off">
</div>
<div class="apps-hint" id="hint" hidden></div>

<main class="apps-grid" id="grid"></main>
<div class="apps-message" id="message" hidden></div>

<script src="/apps.js"></script>
</body>
</html>
