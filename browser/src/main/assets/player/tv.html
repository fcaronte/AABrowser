<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CarWeb TV</title>
    <link rel="icon" href="/icon.svg">
    <link rel="stylesheet" href="/player.css">
    <link rel="stylesheet" href="/tv.css">
    <!-- Colori Material You del telefono, inseriti dall'app (vuoto = colori di player.css) -->
    <style>/*AAB_THEME*/</style>
    <!-- Token, testi tradotti e liste (solo id e nome), inseriti dall'app quando serve la pagina (IptvApi) -->
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<header class="bar">
    <!-- Torna ai file di CarWeb Media -->
    <a class="icon-button" href="/">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
    </a>
    <a class="icon-button" href="/radio" aria-label="Radio">
        <svg viewBox="0 0 24 24"><path d="M10 4 22 1l.5 2L11 6zm-5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2zm1 3v9h7v-9zm11 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
    </a>
    <select class="source" id="source"></select>
    <button class="icon-button" id="refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
</header>

<main class="layout">
    <section class="now">
        <div class="stage" id="stage">
            <video id="media" playsinline></video>
            <div class="art" id="art">
                <img id="artImage" alt="">
                <svg class="note" viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
            </div>
        </div>

        <div class="info">
            <div class="title" id="title"></div>
            <div class="subtitle" id="subtitle"></div>
        </div>

        <!-- Niente etichette "Play"/"Pausa" sui pulsanti: gli script generici di Android Auto li cliccherebbero -->
        <div class="controls">
            <button class="control" id="previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="control main" id="playToggle">
                <svg class="icon-start" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-stop" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="control" id="next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="control toggle" id="favorite">
                <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
        </div>

        <div class="message" id="message" hidden></div>
    </section>

    <section class="list tv-list">
        <div class="tv-tools">
            <input class="search" id="search" type="search" autocomplete="off">
            <div class="groups" id="groups"></div>
        </div>
        <div class="channels" id="channels">
            <div class="channels-space" id="channelsSpace"></div>
        </div>
    </section>
</main>

<script src="/lib/hls.min.js"></script>
<script src="/lib/mpegts.min.js"></script>
<script src="/lists.js"></script>
<script src="/tv.js"></script>
</body>
</html>
