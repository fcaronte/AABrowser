<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Radio</title>
    <link rel="icon" href="/radio.svg">
    <link rel="stylesheet" href="/player.css">
    <link rel="stylesheet" href="/tv.css">
    <link rel="stylesheet" href="/radio.css">
    <style>/*AAB_THEME*/</style>
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<header class="bar has-pages">
    <!-- Le quattro pagine di CarWeb Media: stesse icone, stesso ordine e stesso posto in ogni pagina (lo controlla pages-nav.test.js).
         La pagina aperta è in evidenza e non è un collegamento: ricaricarla fermerebbe quello che suona -->
    <nav class="pages">
        <a class="icon-button" data-page="media" href="/" aria-label="CarWeb Media">
            <svg viewBox="0 0 24 24"><path d="M12 3v10.55A4 4 0 1 0 14 17V7h4V3h-6z"/></svg>
        </a>
        <a class="icon-button" data-page="tv" href="/tv" aria-label="TV">
            <svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg>
        </a>
        <span class="icon-button current" data-page="radio" aria-current="page" aria-label="Radio">
            <svg viewBox="0 0 24 24"><path d="M10 4 22 1l.5 2L11 6zm-5 5h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V11a2 2 0 0 1 2-2zm1 3v9h7v-9zm11 1a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3zm0 5a1.5 1.5 0 1 0 0 3 1.5 1.5 0 0 0 0-3z"/></svg>
        </span>
        <a class="icon-button" data-page="podcast" href="/podcast" aria-label="Podcast">
            <svg viewBox="0 0 24 24"><path d="M14 12c0 .74-.4 1.38-1 1.72V22h-2v-8.28c-.6-.35-1-.98-1-1.72 0-1.1.9-2 2-2s2 .9 2 2zm-2-6c-3.31 0-6 2.69-6 6 0 1.74.75 3.31 1.94 4.4l1.42-1.42C8.53 14.25 8 13.19 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.19-.53 2.25-1.36 2.98l1.42 1.42C17.25 15.31 18 13.74 18 12c0-3.31-2.69-6-6-6zm0-4C6.48 2 2 6.48 2 12c0 2.85 1.2 5.41 3.11 7.24l1.42-1.42C4.98 16.36 4 14.29 4 12c0-4.41 3.59-8 8-8s8 3.59 8 8c0 2.29-.98 4.36-2.53 5.82l1.42 1.42C20.8 17.41 22 14.85 22 12c0-5.52-4.48-10-10-10z"/></svg>
        </a>
    </nav>
    <select class="source" id="source"></select>
    <button class="icon-button" id="refresh" aria-label="Refresh">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.74 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
    </button>
</header>

<main class="layout">
    <section class="now">
        <div class="stage radio-stage">
            <audio id="media" preload="none"></audio>
            <div class="art" id="art">
                <img id="artImage" alt="">
                <img class="radio-mark" src="/radio.svg" alt="">
            </div>
            <!-- Effetti animati sopra la copertina (come in CarWeb Media), solo con un effetto scelto e la radio in onda -->
            <canvas class="visual" id="visual" hidden></canvas>
        </div>
        <div class="info">
            <div class="title" id="title">Radio</div>
            <div class="subtitle" id="subtitle"></div>
            <button class="lyrics-button" id="lyricsButton" hidden></button>
        </div>
        <div class="controls">
            <button class="control" id="previous" aria-label="Previous">
                <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
            </button>
            <button class="control main" id="playToggle" aria-label="Play or pause">
                <svg class="icon-start" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <svg class="icon-stop" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button class="control" id="next" aria-label="Next">
                <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
            </button>
            <button class="control toggle" id="favorite" aria-label="Favorite">
                <svg viewBox="0 0 24 24"><path d="M12 17.27 18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
            </button>
            <!-- Effetti animati: apre la scelta (barre, onda, cerchio); acceso quando ce n'è uno -->
            <button class="control toggle" id="effects" aria-label="Visual effects">
                <svg viewBox="0 0 24 24"><path d="M7 18h2V6H7v12zm4 4h2V2h-2v20zm-8-8h2v-4H3v4zm12 4h2V6h-2v12zm4-8v4h2v-4h-2z"/></svg>
            </button>
        </div>
        <div class="message" id="message" hidden></div>
        <a class="radio-credit" href="https://www.radio-browser.info/" target="_blank" rel="noopener">Radio Browser</a>
    </section>

    <section class="list tv-list radio-list">
        <div class="tv-tools">
            <input class="search" id="search" type="search" autocomplete="off">
            <div class="groups">
                <button class="group active" id="allStations"></button>
                <button class="group" id="favoriteStations"></button>
            </div>
        </div>
        <div class="channels" id="channels">
            <div class="channels-space" id="channelsSpace"></div>
        </div>
    </section>
</main>

<!-- Scelta dell'effetto animato (salvata nella pagina) -->
<div class="sheet" id="optionsSheet" hidden>
    <div class="sheet-card">
        <div class="sheet-title" id="optionsTitle"></div>
        <div class="option-label" id="effectsLabel"></div>
        <div class="choices" id="effectsChoices"></div>
    </div>
</div>

<script src="/lib/hls.min.js"></script>
<script src="/effects.js"></script>
<script src="/track-parser.js"></script>
<script src="/lyrics.js"></script>
<script src="/store.js"></script>
<script src="/lists.js"></script>
<script src="/radio.js"></script>
</body>
</html>
