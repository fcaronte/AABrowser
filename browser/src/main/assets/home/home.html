<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>CarWeb</title>
    <link rel="stylesheet" href="/home.css">
    <!-- Colori dell'app (tema automatico o forzato, colori del telefono), inseriti dall'app (HomeApi) -->
    <style id="theme">/*AAB_THEME*/</style>
    <!-- Token, testi nella lingua dell'app e dati di ora, inseriti dall'app quando serve la pagina -->
    <script>/*AAB_CONFIG*/</script>
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="home">
    <header class="top">
        <div class="brand">
            <span class="brand-name" id="brand"></span>
            <span class="brand-version" id="version"></span>
        </div>
        <div class="actions">
            <a class="text-action" id="openMain" href="about:toggle_open_main">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 19H5V5h7V3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14c1.1 0 2-.9 2-2v-7h-2v7zM14 3v2h3.59l-9.83 9.83 1.41 1.41L19 6.41V10h2V3h-7z"/></svg>
                <span id="openMainLabel"></span>
            </a>
            <a class="icon-btn" id="voice" href="about:toggle_voice">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 14c1.66 0 2.99-1.34 2.99-3L15 5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.3-3c0 3-2.54 5.1-5.3 5.1S6.7 14 6.7 11H5c0 3.41 2.72 6.23 6 6.72V21h2v-3.28c3.28-.48 6-3.3 6-6.72h-1.7z"/></svg>
            </a>
            <a class="icon-btn" id="search" href="about:toggle_search">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
            </a>
            <button class="icon-btn" id="edit" type="button" aria-pressed="false">
                <svg class="when-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                <svg class="when-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
            </button>
        </div>
    </header>
    <div class="subtitle" id="subtitle"></div>

    <div class="grid-wrap" id="gridWrap">
        <div class="grid" id="grid"></div>
        <div class="empty" id="empty" hidden></div>
    </div>

    <div class="update" id="update" hidden>
        <a class="update-go" id="updateGo" href="about:update_download">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 1.01 7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14zm-1-6h-3V8h-2v5H8l4 4 4-4z"/></svg>
            <span id="updateText"></span>
        </a>
        <a class="update-x" id="updateDismiss" href="about:update_dismiss">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </a>
    </div>

    <nav class="bottom">
        <a class="pill" id="resume" href="#" hidden>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            <span id="resumeLabel"></span>
        </a>
        <a class="pill" id="settings" href="https://player.local/settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            <span id="settingsLabel"></span>
        </a>
    </nav>
</div>

<!-- Il modulo per aggiungere o cambiare un preferito: una scheda sopra la pagina (niente finestre di sistema, si vede anche in auto) -->
<div class="modal" id="modal" hidden></div>
<div class="notice" id="notice" role="status" hidden></div>

<script src="/home.js"></script>
</body>
</html>
