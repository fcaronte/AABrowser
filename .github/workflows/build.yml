name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Seleziona il tipo di build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore Secret (if present)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_FILE_SECRET: ${{ secrets.KEYSTORE_FILE }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding Keystore secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > ${{ runner.temp }}/keystore.jks
          elif [ "${{ inputs.build_type }}" = "release" ] && [ -z "$KEYSTORE_FILE_SECRET" ]; then
            # Una release firmata con la chiave di debug del runner non aggiornerebbe l'app installata
            echo "::error::Release build without the signing keystore: set the KEYSTORE_BASE64 secret."
            exit 1
          else
            echo "No base64 keystore secret provided: the debug build uses the default debug signing."
          fi

      - name: Build APK with Gradle
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE || format('{0}/keystore.jks', runner.temp) }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease
          else
            ./gradlew assembleDebug
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: AABrowser-${{ inputs.build_type }}
          path: browser/build/outputs/apk/**/*.apk
